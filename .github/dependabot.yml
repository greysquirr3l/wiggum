version: 2
updates:
  # Enable Dependabot version updates for Rust dependencies
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
    open-pull-requests-limit: 5
    assignees:
      - greysquirr3l
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    labels:
      - dependencies
      - rust
    allow:
      - dependency-type: all
    ignore:
      # Ignore major version bumps for now; apply manually after testing
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  # Enable Dependabot security updates (all channels)
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
    assignees:
      - greysquirr3l
    commit-message:
      prefix: "ci(actions)"
    labels:
      - github-actions
    # One PR for the codeql-action bumps.
    #
    # CodeQL refuses to run when the steps in a workflow disagree about the
    # action version: "Loaded a configuration file for version '4.37.0', but
    # running version '4.39.1'. All steps in a workflow that use
    # `github/codeql-action` must use the same version to work correctly."
    # Dependabot treats each `uses:` line as a separate dependency, so
    # without this group a single bump to codeql-action arrives as three
    # PRs — one per step — and none of them passes CI. Grouping them makes
    # the bump land as one PR that touches all three steps together.
    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"
