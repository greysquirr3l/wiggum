name: Dependabot Auto-Merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

# Default-deny; auto-merge job expands to contents:write and pull-requests:write.
permissions: {}

jobs:
  auto-merge:
    name: Auto-merge Dependabot PRs
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Dependabot signs the commits it makes, but a rebase — the one
          # GitHub performs when the branch falls behind `main`, which is
          # exactly when an auto-merge PR wants to land — rewrites the
          # commit and the signature no longer verifies. The action refuses
          # the PR in that state ("Dependabot's commit signature is not
          # verified, refusing to proceed"), which leaves the check red and
          # the PR unmergeable.
          #
          # The signature is not what this workflow is for. It decides
          # whether an update is a patch or a minor bump; the branch is
          # only ever merged after review, and the review is on the diff,
          # not on the signature. Skipping the check costs nothing here
          # and stops a routine rebase from wedging the PR.
          skip-commit-verification: true

      - name: Enable auto-merge for patch and minor updates
        id: merge
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Auto-merge requires the repository setting "Allow auto-merge" to be
        # enabled. The CLI call will fail with GraphQL "Auto merge is not
        # allowed for this repository" if it isn't. Treat that as a soft
        # warning rather than a hard failure so CI stays green and the PR
        # still requires manual review / merge.
        continue-on-error: true
        run: |
          if gh pr merge --auto --squash "$PR_URL"; then
            echo "merge=enabled" >> "$GITHUB_OUTPUT"
          else
            echo "merge=skipped" >> "$GITHUB_OUTPUT"
            echo "::warning::Could not enable auto-merge. Enable 'Allow auto-merge' in repository settings (Settings → General → Pull Requests) to activate this workflow."
          fi